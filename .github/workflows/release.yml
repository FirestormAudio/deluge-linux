name: release

on:
  push:
    tags: ['v*']

jobs:
  # Gate the multi-hour bundle build on the packer tests. Without this, a tag
  # whose packing tools are broken burns a runner for hours and then publishes
  # a bundle nobody can unpack.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y cpio
      - run: python3 -m pip install pytest
      - run: python3 -m pytest tests/ -v

  release:
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Buildroot's host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio file git rsync unzip wget \
                                  python3 libncurses-dev device-tree-compiler zstd

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: .buildroot/dl
          key: dl-${{ hashFiles('Makefile', 'configs/deluge_defconfig') }}
          restore-keys: dl-

      # Compiler cache, shared with the build workflow's per-profile caches.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-bundle-${{ github.run_id }}
          restore-keys: |
            ccache-bundle-
            ccache-

      # The bundle is the release: it builds both profiles + the SDK toolchain
      # and assembles boot/ + rootfs/ + toolchain/ + manifest.json into one
      # sha256-pinned tarball. This is what libdeluge and deluge-sdk pin and consume.
      - name: Build the base bundle
        run: make bundle VERSION=${GITHUB_REF_NAME#v}

      # The prebuilt image: the platform profile (launcher, shell, SSH), packed
      # straight from the bundle (no rebuild) and ready to drop in the SD
      # card's /APPS/. Pack from its own boot/platform/ kernel, then validate
      # the result against the same map the packer used. base has no app of
      # its own, so it ships only inside the bundle, for deluge-mkimage.
      - name: Pack LINUX.ELF from the bundle
        run: |
          set -euo pipefail
          B=out/deluge-base-${GITHUB_REF_NAME#v}
          python3 tools/mk-app-elf.py --map "$B/manifest.json" --dir "$B/boot/platform" \
              --rootfs "$B/rootfs/platform.cpio" out/LINUX.ELF
          python3 tools/check-app-elf.py --map "$B/manifest.json" out/LINUX.ELF

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/deluge-base-*.tar.zst
            out/deluge-base-*.tar.zst.sha256
            out/LINUX.ELF
